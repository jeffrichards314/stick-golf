    const t0 = performance.now();
    lastCam = cam;
    if (!prevAim && qs.get('noshoot')) prevAim = { angle: -1.1, power: 0.4 };
    const ghost = $('ghost').checked && ghostPts ? { points: ghostPts, t: ((time - ghostT0) % 4) / 3 > 1 ? 1 : ((time - ghostT0) % 4) / 3 } : null;
    R.draw({ cam, W, S, aim, fogReveal: fog, shake, time, dt, ghost, prevAim: $('prevaim').checked ? prevAim : null, a11y: { colorblind: $('cb').checked, reducedFx: $('rfx').checked } });
    fpsT += dt; frames++;
    if (fpsT > 0.5) { $('fps').textContent = Math.round(frames / fpsT) + ' fps, draw ' + (performance.now() - t0).toFixed(1) + 'ms'; fpsT = 0; frames = 0; }
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
  canvas.addEventListener('click', (ev) => {
    if (!lastCam) return;
    const p = R.screenToWorld(ev.clientX, ev.clientY, lastCam);
    S.x = p[0]; S.y = p[1]; S.vx = 0; S.vy = 0; S.hold = false; S.rest = false; S.ride = -1; S.bub = -1; S.cannon = -1; S.stuck = false; S.holed = false; S.failed = null; restT = 0; R.trailClear();
  });
  window.__T = { R, hole, setGhost: (pts) => { ghostPts = pts; ghostT0 = performance.now() / 1000; }, spawn: (k, x, y) => R.spawn(k, x, y), get S() { return S; }, W: () => W };
})();
</script>
